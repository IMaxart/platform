services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imaxart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imaxart}
      POSTGRES_DB: ${POSTGRES_DB:-imaxart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-imaxart}']
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=false

  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-imaxart}:${POSTGRES_PASSWORD:-imaxart}@postgres:5432/${POSTGRES_DB:-imaxart}
    restart: 'no'

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    labels:
      - traefik.enable=false

  platform:
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-localhost}
      HASH_SECRET: ${HASH_SECRET:-change-me-to-a-random-secret-at-least-32-chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-${HASH_SECRET:-change-me-to-a-random-secret-at-least-32-chars}}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-imaxart}:${POSTGRES_PASSWORD:-imaxart}@postgres:5432/${POSTGRES_DB:-imaxart}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-IMaxart Platform <noreply@localhost>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@imaxart.com}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword123!}
    labels:
      - traefik.enable=true

  status:
    build:
      context: .
      dockerfile: apps/status/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-imaxart}:${POSTGRES_PASSWORD:-imaxart}@postgres:5432/${POSTGRES_DB:-imaxart}
    labels:
      - traefik.enable=true

volumes:
  pgdata:
