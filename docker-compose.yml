services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imaxart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imaxart}
      POSTGRES_DB: ${POSTGRES_DB:-imaxart}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-imaxart}']
      interval: 5s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=false

  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-imaxart}:${POSTGRES_PASSWORD:-imaxart}@postgres:5432/${POSTGRES_DB:-imaxart}
    restart: 'no'

  platform:
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-localhost}
      HASH_SECRET: ${HASH_SECRET:-change-me-to-a-random-secret-at-least-32-chars}
      DATABASE_URL: postgresql://${POSTGRES_USER:-imaxart}:${POSTGRES_PASSWORD:-imaxart}@postgres:5432/${POSTGRES_DB:-imaxart}
    labels:
      - traefik.enable=true
      - traefik.http.routers.platform.rule=Host(`platform.${ADMIN_DOMAIN:-localhost}`)
      - traefik.http.services.platform.loadbalancer.server.port=3000

  status:
    build:
      context: .
      dockerfile: apps/status/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-imaxart}:${POSTGRES_PASSWORD:-imaxart}@postgres:5432/${POSTGRES_DB:-imaxart}
    labels:
      - traefik.enable=true
      - traefik.http.routers.status.rule=Host(`status.${ADMIN_DOMAIN:-localhost}`)
      - traefik.http.services.status.loadbalancer.server.port=3000

volumes:
  pgdata:
