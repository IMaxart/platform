services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${HOST_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-analytics}:${POSTGRES_PASSWORD:-analytics}@db:5432/${POSTGRES_DB:-analytics}
      HASH_SECRET: ${HASH_SECRET:-change-me-to-a-random-secret}
      NODE_ENV: production
      PORT: 3000
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-localhost}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analytics}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-analytics}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
